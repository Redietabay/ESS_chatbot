<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ESS Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page backend-bg">
    <div class="auth-container">
        <div class="auth-logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="ESS Logo" style="height: 70px; width: auto; margin-bottom: 12px; object-fit: contain;">
            <h1>ESS Chatbot</h1>
            <p>Ethiopian Statistical Service Insights</p>
        </div>
        
        <div class="auth-box">
            <h2>Welcome Back</h2>
            {% if error %}
                <div class="auth-error">
                    {{ error }}
                </div>
            {% endif %}
            
            <form action="/login" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Enter username" required autocomplete="off">
                </div>
                
                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                        <label style="margin-bottom: 0;">Password</label>
                        <a href="/forgot-password" class="forgot-link">Forgot password?</a>
                    </div>
                    <input type="password" name="password" placeholder="Enter password" required>
                </div>
                
                <button type="submit" class="btn-send auth-btn">Login</button>
            </form>
            <p class="auth-footer-text">
                Don't have an account? <a href="/register">Register here</a>
            </p>
        </div>
    </div>
</body>
</html>
