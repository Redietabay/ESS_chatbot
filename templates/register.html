<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ESS Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page backend-bg">
    <div class="auth-container">
        <div class="auth-logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="ESS Logo" style="height: 70px; width: auto; margin-bottom: 12px; object-fit: contain;">
            <h1>Create Account</h1>
            <p>Join the ESS Data Intelligence Platform</p>
        </div>

        <div class="auth-box">
            <h2>Sign Up</h2>
            {% if error %}
                <div class="auth-error">
                    {{ error }}
                </div>
            {% endif %}

            <form action="/register" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Letters, numbers, or underscores" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="name@example.com" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Minimum 8 characters" required>
                </div>
                <button type="submit" class="btn-send auth-btn">Register</button>
            </form>
            <p class="auth-footer-text">
                Already have an account? <a href="/login">Login here</a>
            </p>
        </div>
    </div>
</body>
</html>
